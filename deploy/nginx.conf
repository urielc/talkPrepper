# Lesson Prep — reverse proxy to the app on 127.0.0.1:8765.
# The app sets its own security headers; nothing to add here.
limit_req_zone $binary_remote_addr zone=lp_auth:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name CHANGE.ME;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name CHANGE.ME;

    ssl_certificate     /etc/letsencrypt/live/CHANGE.ME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE.ME/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1m;

    location /api/auth/ {
        limit_req zone=lp_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        # The AI chat streams server-sent events; do not buffer or time them out early.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
