# Lesson Prep — nginx site, HTTPS only, reverse-proxied to the app on 127.0.0.1:8765.
#
# No `add_header` lines here: the app sets its own security headers
# (X-Content-Type-Options, Referrer-Policy, Permissions-Policy, X-Frame-Options,
# Content-Security-Policy, and HSTS once LP_COOKIE_SECURE/LP_BASE_URL make it
# https). Duplicating them here would just risk them disagreeing.

limit_req_zone $binary_remote_addr zone=lp_auth:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name CHANGE.ME;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name CHANGE.ME;

    # certbot --nginx will fill these in; placeholders until then.
    ssl_certificate     /etc/letsencrypt/live/CHANGE.ME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE.ME/privkey.pem;

    client_max_body_size 1m;

    location /api/auth/ {
        limit_req zone=lp_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }
}
